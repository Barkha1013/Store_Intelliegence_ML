kind = "data-app"
previewPath = "/"
title = "Store Intelligence Dashboard"
version = "1.0.0"
id = "artifacts/dashboard"
router = "path"

[[integratedSkills]]
name = "data-visualization"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23183

[services.development]
run = "pnpm --filter @workspace/dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dashboard", "run", "build" ]
publicDir = "artifacts/dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23183"
BASE_PATH = "/"

[[services]]
name = "streamlit"
paths = [ "/streamlit" ]
localPort = 5000

[services.development]
run = "streamlit run /home/runner/workspace/store-intelligence/dashboard/streamlit_app.py --server.port 5000 --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false --server.baseUrlPath streamlit"

[services.development.env]
DB_PATH = "/home/runner/workspace/store-intelligence/data/store_intelligence.db"
